<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Supermercado</title>
    <meta name="theme-color" content="#FF6061" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Pantalla de ingreso -->
    <div id="pantalla-login" class="pantalla-login">
      <div class="login-card">
        <h1 class="login-titulo">🛒 Supermercado</h1>
        <p class="texto-ayuda" id="login-subtitulo">Elegí tu nombre e ingresá el código</p>
        <div id="login-mensaje" class="mensaje-box"></div>

        <form id="form-login" class="form-vertical">
          <label>
            Usuario
            <select id="login-usuario" required>
              <option value="" disabled selected>Elegí tu nombre</option>
              <option value="Nadia">Nadia</option>
              <option value="Leo">Leo</option>
            </select>
          </label>
          <label>
            Código
            <input
              type="password"
              id="login-codigo"
              required
              inputmode="numeric"
              autocomplete="off"
            />
          </label>
          <button type="submit" class="btn btn--primario btn--ancho">Ingresar</button>
        </form>
      </div>
    </div>

    <!-- Pantalla principal de la app -->
    <div id="pantalla-app" class="pantalla-app oculto">
      <!-- La barra rosa ocupa todo el ancho, pero su contenido se centra con
           el mismo ancho máximo que el resto de la app (.header-app__inner). -->
      <header class="header-app">
        <div class="header-app__inner">
          <h1>🛒 Supermercado</h1>
          <div class="header-app__acciones">
            <span id="header-usuario" class="header-app__usuario"></span>
            <button id="btn-logout" class="btn btn--secundario btn--chico" type="button">Cerrar sesión</button>
          </div>
        </div>
      </header>

      <nav class="tabs">
        <button id="btn-tab-lista" class="tab-btn tab-btn--activo" type="button">Lista</button>
        <button id="btn-tab-menu" class="tab-btn" type="button">Menú</button>
        <button id="btn-tab-configuracion" class="tab-btn" type="button">Configuración</button>
      </nav>

      <section id="tab-lista" class="tab-panel">
        <nav class="subtabs">
          <button id="btn-subtab-presencial" class="subtab-btn subtab-btn--activo" type="button">
            Presencial
          </button>
          <button id="btn-subtab-online" class="subtab-btn" type="button">Online</button>
        </nav>
        <div id="lista-presencial" class="subtab-panel"></div>
        <div id="lista-online" class="subtab-panel oculto"></div>
      </section>

      <!-- Menú semanal: se dibuja entero desde js/menu.js -->
      <section id="tab-menu" class="tab-panel oculto"></section>

      <section id="tab-configuracion" class="tab-panel oculto">
        <nav class="subtabs">
          <button id="btn-subtab-productos" class="subtab-btn subtab-btn--activo" type="button">
            Productos
          </button>
          <button id="btn-subtab-supermercados" class="subtab-btn" type="button">Supermercados</button>
          <button id="btn-subtab-tipos-producto" class="subtab-btn" type="button">Tipos de producto</button>
          <button id="btn-subtab-menu" class="subtab-btn" type="button">Menú</button>
        </nav>
        <div id="config-productos" class="subtab-panel"></div>
        <div id="config-supermercados" class="subtab-panel oculto"></div>
        <div id="config-tipos-producto" class="subtab-panel oculto"></div>
        <div id="config-menu" class="subtab-panel oculto"></div>
      </section>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
